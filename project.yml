name: ExerciseSnacks
options:
  bundleIdPrefix: local
  deploymentTarget:
    iOS: '26.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '6.0'
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    TARGETED_DEVICE_FAMILY: '1'
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
targets:
  ExerciseSnacks:
    type: application
    platform: iOS
    sources: [ExerciseSnacks, Shared]
    entitlements:
      path: ExerciseSnacks/ExerciseSnacks.entitlements
      properties:
        com.apple.security.application-groups: [group.local.ExerciseSnacks]
    dependencies:
      - target: ExerciseSnacksWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.ExerciseSnacks
        DEVELOPMENT_TEAM: FMA5NVPU24
        INFOPLIST_KEY_CFBundleDisplayName: Exercise Snacks
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ExerciseSnacksWidget:
    type: app-extension
    platform: iOS
    sources: [ExerciseSnacksWidget, Shared]
    info:
      path: ExerciseSnacksWidget/Info.plist
      properties:
        CFBundleDisplayName: Snack rhythm
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ExerciseSnacksWidget/ExerciseSnacksWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.local.ExerciseSnacks]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.ExerciseSnacks.Widget
        DEVELOPMENT_TEAM: FMA5NVPU24
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  ExerciseSnacksTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ExerciseSnacksTests]
    dependencies:
      - target: ExerciseSnacks
  ExerciseSnacksUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ExerciseSnacksUITests]
    dependencies:
      - target: ExerciseSnacks
schemes:
  ExerciseSnacks:
    build:
      targets:
        ExerciseSnacks: all
    test:
      targets:
        - ExerciseSnacksTests
        - ExerciseSnacksUITests
