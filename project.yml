name: ExerciseSnacks
options:
  bundleIdPrefix: local
  deploymentTarget:
    iOS: '26.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '6.0'
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    TARGETED_DEVICE_FAMILY: '1'
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
targets:
  ExerciseSnacks:
    type: application
    platform: iOS
    sources: [ExerciseSnacks]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.ExerciseSnacks
        INFOPLIST_KEY_CFBundleDisplayName: Exercise Snacks
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ExerciseSnacksTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ExerciseSnacksTests]
    dependencies:
      - target: ExerciseSnacks
  ExerciseSnacksUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ExerciseSnacksUITests]
    dependencies:
      - target: ExerciseSnacks
schemes:
  ExerciseSnacks:
    build:
      targets:
        ExerciseSnacks: all
    test:
      targets:
        - ExerciseSnacksTests
        - ExerciseSnacksUITests

